# project.yml
# XcodeGen spec — this file replaces the need to ever open Xcode's
# "New Project" wizard. Running `xcodegen generate` (done automatically
# by the GitHub Actions workflow) reads this and produces a real
# FTCTeamHub.xcodeproj on the fly, every single build.
#
# Place this file at the ROOT of your repo (same level as the FTCTeamHub/
# source folder), NOT inside FTCTeamHub/.

name: FTCTeamHub
options:
  bundleIdPrefix: com.ftcteamhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FTCTeamHub:
    type: application
    platform: iOS
    sources:
      - path: FTCTeamHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcteamhub.app
        PRODUCT_NAME: FTCTeamHub
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Signing is intentionally left OFF here — GitHub Actions produces
        # an unsigned build. AltServer performs the actual signing with
        # your personal Apple ID at sideload time.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: FTCTeamHub/Info.plist
      properties:
        CFBundleDisplayName: FTC Team Hub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true

schemes:
  FTCTeamHub:
    build:
      targets:
        FTCTeamHub: all
    archive:
      config: Release
