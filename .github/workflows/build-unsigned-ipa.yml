# .github/workflows/build-unsigned-ipa.yml
#
# Builds FTCTeamHub entirely on a GitHub-hosted macOS runner — no local
# Mac needed. Produces an UNSIGNED .ipa as a downloadable artifact.
# AltServer signs it with your personal Apple ID at sideload time, exactly
# like any other AltStore installation.
#
# Fix vs. previous version: we no longer hardcode a specific Xcode version
# (e.g. Xcode_15.4.app). GitHub's macOS runner images change which Xcode
# versions are preinstalled over time, and a mismatch between the Xcode
# used to GENERATE the project (xcodegen) and the Xcode used to BUILD it
# causes "future Xcode project file format" errors. Instead we detect and
# select the newest Xcode actually present on the runner, once, and use
# that same selection for every subsequent step.

name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List available Xcode versions (diagnostic)
        run: ls /Applications | grep Xcode

      - name: Select newest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build unsigned .app for iOS devices
        run: |
          xcodebuild build \
            -project FTCTeamHub.xcodeproj \
            -scheme FTCTeamHub \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .app into an unsigned .ipa
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FTCTeamHub.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r FTCTeamHub-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTCTeamHub-unsigned-ipa
          path: build/FTCTeamHub-unsigned.ipa
