# .github/workflows/build-unsigned-ipa.yml
#
# Builds FTCTeamHub entirely on a GitHub-hosted macOS runner. Produces an
# UNSIGNED .ipa as a downloadable artifact. AltServer signs it with your
# personal Apple ID at sideload time.
#
# CHANGE: added `-quiet` to the xcodebuild invocation. Without it, Xcode
# prints every single compiler flag for every one of Firebase's ~40
# sub-targets (leveldb, gRPC, abseil, nanopb, etc.) — multiple MEGABYTES of
# noise per run — which buries the one or two lines that actually matter
# when something fails. `-quiet` suppresses that noise and only shows
# warnings/errors, so if this fails again, the log will actually be
# readable instead of a multi-million-character wall of -fmodule-map-file
# flags.

name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List available Xcode versions (diagnostic)
        run: ls /Applications | grep Xcode

      - name: Select newest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build unsigned .app for iOS devices
        run: |
          xcodebuild build \
            -project FTCTeamHub.xcodeproj \
            -scheme FTCTeamHub \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .app into an unsigned .ipa
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FTCTeamHub.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r FTCTeamHub-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTCTeamHub-unsigned-ipa
          path: build/FTCTeamHub-unsigned.ipa
