# .github/workflows/build-ipa.yml
#
# Builds an UNSIGNED .ipa of the FTC Team Platform app on GitHub's hosted
# macOS runner and publishes it as a downloadable artifact + GitHub Release.
# No Mac and no paid Apple Developer account required.
#
# SETUP (do this once, on Windows, before pushing):
#   1. Create a folder in your repo root, e.g. "FTCPlatform/", containing your
#      Xcode project: FTCPlatform.xcodeproj (or .xcworkspace if using SPM
#      packages like GoogleSignIn-iOS added via Xcode's Package Dependencies).
#   2. Edit the env block below: PROJECT_PATH, SCHEME, and WORKSPACE_PATH
#      (leave WORKSPACE_PATH blank if you only have a .xcodeproj, no workspace).
#   3. Commit and push this file plus your Xcode project to GitHub. The
#      workflow runs automatically on every push to "main", or manually from
#      the Actions tab ("Run workflow" button).
#   4. Download the .ipa from the workflow run's "Artifacts" section, or from
#      the "Releases" page of your repo (a new release is tagged per run).
#   5. On iPhone: sideload the .ipa with AltStore, SideStore, or LiveContainer.
#      Unsigned IPAs still need one of these tools to install — iOS will not
#      install a raw .ipa on its own.

name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  # Path to the folder containing your .xcodeproj/.xcworkspace (relative to repo root)
  PROJECT_DIR: "FTCPlatform"
  # Name of your .xcodeproj file, without extension
  PROJECT_NAME: "FTCPlatform"
  # If you added SPM packages (e.g. GoogleSignIn-iOS) via Xcode, an .xcworkspace
  # is auto-generated with the same base name — set to "true" if it exists.
  USE_WORKSPACE: "false"
  SCHEME: "FTCPlatform"
  APP_NAME: "FTCPlatform"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Resolve Swift Package dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "${{ env.USE_WORKSPACE }}" = "true" ]; then
            xcodebuild -resolvePackageDependencies -workspace "${{ env.PROJECT_NAME }}.xcworkspace" -scheme "${{ env.SCHEME }}"
          else
            xcodebuild -resolvePackageDependencies -project "${{ env.PROJECT_NAME }}.xcodeproj" -scheme "${{ env.SCHEME }}"
          fi

      - name: Archive (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "${{ env.USE_WORKSPACE }}" = "true" ]; then
            BUILD_TARGET="-workspace ${{ env.PROJECT_NAME }}.xcworkspace"
          else
            BUILD_TARGET="-project ${{ env.PROJECT_NAME }}.xcodeproj"
          fi

          xcodebuild archive \
            $BUILD_TARGET \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          set -e
          ARCHIVE="$RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          mkdir -p "$PAYLOAD_DIR"

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in archive. Check PROJECT_NAME/SCHEME."
            exit 1
          fi

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd "$RUNNER_TEMP"
          zip -r -y "${{ env.APP_NAME }}.ipa" "Payload" > /dev/null
          mkdir -p ${{ github.workspace }}/output
          cp "$RUNNER_TEMP/${{ env.APP_NAME }}.ipa" ${{ github.workspace }}/output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: output/${{ env.APP_NAME }}.ipa
          retention-days: 30

      - name: Create GitHub Release with IPA
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ env.APP_NAME }} build #${{ github.run_number }}"
          files: output/${{ env.APP_NAME }}.ipa
          body: |
            Unsigned IPA auto-built from commit ${{ github.sha }}.
            Sideload with AltStore, SideStore, or LiveContainer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
