# project.yml
# XcodeGen spec. NEW: NSCameraUsageDescription added — required at runtime
# for the QR check-in/check-out scanner (VisionKit DataScannerViewController).
# Without this key, iOS silently kills the app the instant camera access
# is requested — always add a usage description BEFORE using any camera API.

name: FTCTeamHub
options:
  bundleIdPrefix: com.ftcteamhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  FTCTeamHub:
    type: application
    platform: iOS
    sources:
      - path: FTCTeamHub
    resources:
      - path: FTCTeamHub/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcteamhub.app
        PRODUCT_NAME: FTCTeamHub
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: FTCTeamHub/Info.plist
      properties:
        CFBundleDisplayName: FTC Team Hub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "FTC Team Hub uses the camera to scan QR labels on inventory items for quick check-in and check-out."

schemes:
  FTCTeamHub:
    build:
      targets:
        FTCTeamHub: all
    archive:
      config: Release
