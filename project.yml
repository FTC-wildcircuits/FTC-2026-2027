# project.yml
# XcodeGen spec. Now includes the Firebase iOS SDK as a Swift Package
# dependency (added declaratively here — no Xcode GUI needed to add it)
# and bundles GoogleService-Info.plist as a resource for cross-device sync.
#
# You MUST place a real GoogleService-Info.plist (from your own Firebase
# project console) at FTCTeamHub/GoogleService-Info.plist before this will
# build correctly — see FIREBASE_SETUP.md for the exact steps.

name: FTCTeamHub
options:
  bundleIdPrefix: com.ftcteamhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  FTCTeamHub:
    type: application
    platform: iOS
    sources:
      - path: FTCTeamHub
    resources:
      - path: FTCTeamHub/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcteamhub.app
        PRODUCT_NAME: FTCTeamHub
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: FTCTeamHub/Info.plist
      properties:
        CFBundleDisplayName: FTC Team Hub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true

schemes:
  FTCTeamHub:
    build:
      targets:
        FTCTeamHub: all
    archive:
      config: Release
