# project.yml
# XcodeGen spec.
#
# NOTE: ASSETCATALOG_COMPILER_APPICON_NAME is intentionally OMITTED for now.
# That setting tells Xcode "use an icon set called AppIcon" — if no such
# icon set actually exists in Assets.xcassets, the build fails outright.
# Since the app icon assets haven't been added yet, this version builds
# fine with iOS's default gray placeholder icon. Once you complete
# APP_ICON_SETUP.md (adding Assets.xcassets/AppIcon.appiconset/...), add
# this one line back under settings.base:
#   ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

name: FTCTeamHub
options:
  bundleIdPrefix: com.ftcteamhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  FTCTeamHub:
    type: application
    platform: iOS
    sources:
      - path: FTCTeamHub
    resources:
      - path: FTCTeamHub/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcteamhub.app
        PRODUCT_NAME: FTCTeamHub
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: FTCTeamHub/Info.plist
      properties:
        CFBundleDisplayName: FTC Team Hub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "FTC Team Hub uses the camera to scan QR labels on inventory items for quick check-in and check-out."

schemes:
  FTCTeamHub:
    build:
      targets:
        FTCTeamHub: all
    archive:
      config: Release
